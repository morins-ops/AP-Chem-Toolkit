<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pH Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        input { margin: 10px 0; }
    </style>
</head>
<body>
    <h1>pH Calculator</h1>
    <h2>Calculate pH from H<sup>+</sup> concentration</h2>
    <label for="hConcentration">H<sup>+</sup> Concentration (M): </label>
    <input type="number" step="any" id="hConcentration">
    <button onclick="calculatePHfromHConcentration()">Calculate pH</button>
    <p id="phResultFromH"></p>

    <h2>Calculate H<sup>+</sup> concentration from pH</h2>
    <label for="phValue">pH: </label>
    <input type="number" step="any" id="phValue">
    <button onclick="calculateHConcentrationFromPH()">Calculate [H<sup>+</sup>]</button>
    <p id="hConcentrationResult"></p>

    <script>
        function calculatePHfromHConcentration() {
            const hConcentration = parseFloat(document.getElementById('hConcentration').value);
            if (!isNaN(hConcentration) && hConcentration > 0) {
                const ph = -Math.log10(hConcentration);
                document.getElementById('phResultFromH').innerText = `pH: ${ph.toFixed(2)}`;
            } else {
                document.getElementById('phResultFromH').innerText = 'Please enter a valid H+ concentration.';
            }
        }

        function calculateHConcentrationFromPH() {
            const ph = parseFloat(document.getElementById('phValue').value);
            if (!isNaN(ph) && ph >= 0 && ph <= 14) {
                const hConcentration = Math.pow(10, -ph);
                document.getElementById('hConcentrationResult').innerText = `H+: ${hConcentration.toFixed(2)} M`;
            } else {
                document.getElementById('hConcentrationResult').innerText = 'Please enter a valid pH value (0-14).';
            }
        }
    </script>
</body>
</html>
