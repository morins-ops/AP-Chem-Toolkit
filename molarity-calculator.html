<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molarity and Dilution Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        input { margin: 5px; }
        #result { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Molarity and Dilution Calculator</h1>
    
    <h2>Molarity Calculation</h2>
    <label for="soluteMass">Mass of solute (g): </label>
    <input type="number" id="soluteMass"><br>
    
    <label for="solventVolume">Volume of solvent (L): </label>
    <input type="number" id="solventVolume"><br>
    
    <button onclick="calculateMolarity()">Calculate Molarity</button>
    
    <h2>Dilution Calculation</h2>
    <label for="m1">M1 (initial molarity): </label>
    <input type="number" id="m1"><br>
    
    <label for="v1">V1 (initial volume): </label>
    <input type="number" id="v1"><br>
    
    <label for="m2">M2 (final molarity): </label>
    <input type="number" id="m2"><br>
    
    <button onclick="calculateDilution()">Calculate Dilution</button>
    
    <div id="result"></div>
    
    <script>
        function calculateMolarity() {
            const soluteMass = parseFloat(document.getElementById('soluteMass').value);
            const solventVolume = parseFloat(document.getElementById('solventVolume').value);
            let resultText = '';
            
            if (isNaN(soluteMass) || isNaN(solventVolume) || solventVolume <= 0) {
                resultText = 'Error: Please enter valid positive numbers for mass and volume.';
            } else {
                const molarity = soluteMass / solventVolume; // Simplified example, should include molar mass
                resultText = `Molarity: ${molarity.toFixed(2)} M`;
            }
            document.getElementById('result').innerText = resultText;
        }

        function calculateDilution() {
            const m1 = parseFloat(document.getElementById('m1').value);
            const v1 = parseFloat(document.getElementById('v1').value);
            const m2 = parseFloat(document.getElementById('m2').value);
            let resultText = '';

            if (isNaN(m1) || isNaN(v1) || isNaN(m2) || m1 <= 0 || v1 <= 0 || m2 <= 0) {
                resultText = 'Error: Please enter valid positive numbers for M1, V1, and M2.';
            } else {
                const v2 = (m1 * v1) / m2;
                resultText = `V2: ${v2.toFixed(2)} L`;
            }
            document.getElementById('result').innerText += '\n\n' + resultText;
        }
    </script>
</body>
</html>
